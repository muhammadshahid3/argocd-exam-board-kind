namespace: exam-board

argocd:
  enabled: true

ingressClassName: nginx
annotations:
  nginx.ingress.kubernetes.io/rewrite-target: /

paths:
  - path: /student
    pathType: Prefix
    service: student-service
    port: 8000
  - path: /admin
    pathType: Prefix
    service: admin-service
    port: 8001
