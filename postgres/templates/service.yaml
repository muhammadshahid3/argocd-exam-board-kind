apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  annotations:
    {{- include "postgres.syncWave" (dict "root" $ "wave" "3") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
