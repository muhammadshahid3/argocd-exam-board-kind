apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exam-board-namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # TODO: apna git repo URL yahan daalo
    repoURL: https://github.com/muhammadshahid3/argocd-exam-board-kind
    targetRevision: main
    path: namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: exam-board
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    automated:
      prune: true
      selfHeal: true
